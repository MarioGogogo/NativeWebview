<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSBridge 通信测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #333; font-size: 22px; margin-bottom: 16px; text-align: center; }
        h2 { color: #666; font-size: 16px; margin-bottom: 12px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-file { background: #8b5cf6; color: white; }
        .btn-camera { background: #ec4899; color: white; }
        .log-area {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 16px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            color: #0f0;
        }
        .log-item { margin: 4px 0; line-height: 1.4; }
        .log-item.sent { color: #60a5fa; }
        .log-item.received { color: #34d399; }
        .log-item.info { color: #fbbf24; }
        .device-info { background: #f3f4f6; padding: 12px; border-radius: 8px; font-size: 13px; color: #666; }
        .device-info div { margin: 4px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔗 JSBridge 通信测试</h1>
        <div class="device-info" id="deviceInfo">正在获取设备信息...</div>
    </div>

    <div class="card">
        <h2>📤 发送消息到 RN</h2>
        <button class="btn btn-primary" onclick="sendSimpleMessage()">发送简单消息</button>
        <button class="btn btn-success" onclick="sendJsonMessage()">发送 JSON 数据</button>
        <button class="btn btn-warning" onclick="sendActionMessage()">发送 Action 请求</button>
    </div>

    <div class="card">
        <h2>📷 原生能力测试</h2>
        <button class="btn btn-file" onclick="document.getElementById('fileInput').click()">🖼️ 打开相册</button>
        <button class="btn btn-camera" onclick="document.getElementById('cameraInput').click()">📸 打开相机</button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="handleFileSelect(event)">
        <p style="font-size: 12px; color: #999; margin-top: 8px;" id="fileInfo"></p>
    </div>

    <div class="card">
        <h2>📋 通信日志</h2>
        <div class="log-area" id="logArea"></div>
        <button class="btn btn-primary" onclick="clearLogs()" style="margin-top: 12px;">清空日志</button>
    </div>

    <script>
        const logArea = document.getElementById('logArea');
        const deviceInfoEl = document.getElementById('deviceInfo');

        // 日志函数
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `log-item ${type}`;
            div.textContent = `[${time}] ${message}`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLogs() {
            logArea.innerHTML = '';
            log('日志已清空', 'info');
        }

        // 初始化：获取设备信息
        function initDeviceInfo() {
            if (typeof window.NativeBridge !== 'undefined') {
                try {
                    const info = JSON.parse(window.NativeBridge.getDeviceInfo());
                    const timestamp = window.NativeBridge.getTimestamp();
                    deviceInfoEl.innerHTML = `
                        <div><strong>平台:</strong> ${info.platform}</div>
                        <div><strong>系统版本:</strong> Android ${info.version}</div>
                        <div><strong>设备型号:</strong> ${info.brand} ${info.model}</div>
                        <div><strong>时间戳:</strong> ${timestamp}</div>
                    `;
                    log('✅ JSBridge 已连接', 'info');
                } catch (e) {
                    deviceInfoEl.textContent = '获取设备信息失败: ' + e.message;
                    log('❌ JSBridge 连接失败', 'info');
                }
            } else {
                deviceInfoEl.textContent = 'JSBridge 未注入（可能不在 WebView 环境）';
                log('⚠️ 非 WebView 环境', 'info');
            }
        }

        // 发送消息到 RN
        function sendToRN(data) {
            const message = typeof data === 'string' ? data : JSON.stringify(data);
            if (typeof window.NativeBridge !== 'undefined') {
                window.NativeBridge.postMessage(message);
                log(`📤 发送: ${message}`, 'sent');
            } else {
                log('❌ NativeBridge 不可用', 'info');
            }
        }

        function sendSimpleMessage() {
            sendToRN('Hello from WebView!');
        }

        function sendJsonMessage() {
            sendToRN({
                type: 'user_action',
                payload: {
                    action: 'click',
                    element: 'button',
                    timestamp: Date.now()
                }
            });
        }

        function sendActionMessage() {
            sendToRN({
                type: 'request',
                action: 'getUserInfo',
                callbackId: 'cb_' + Date.now()
            });
        }

        // 处理文件选择
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const fileInfo = {
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    lastModified: new Date(file.lastModified).toLocaleString()
                };
                document.getElementById('fileInfo').textContent =
                    `✅ 已选择: ${file.name} (${formatFileSize(file.size)})`;
                log(`📷 选择文件: ${file.name}`, 'info');
                // 发送文件信息到 RN
                sendToRN({
                    type: 'file_selected',
                    data: fileInfo
                });
            }
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        // 接收来自 RN 的消息 (方式1: 函数回调)
        window.onNativeMessage = function(data) {
            log(`📥 收到: ${data}`, 'received');
            try {
                const parsed = JSON.parse(data);
                if (parsed.type === 'response') {
                    log(`📦 响应数据: ${JSON.stringify(parsed.data)}`, 'received');
                }
            } catch (e) {
                // 非 JSON 格式，忽略
            }
        };

        // 接收来自 RN 的消息 (方式2: 事件监听)
        window.addEventListener('nativeMessage', function(event) {
            log(`📥 事件收到: ${event.detail}`, 'received');
        });

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initDeviceInfo);

        // 如果 DOMContentLoaded 已经触发，直接初始化
        if (document.readyState !== 'loading') {
            initDeviceInfo();
        }
    </script>
</body>
</html>
