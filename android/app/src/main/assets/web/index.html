<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSBridge 通信测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #333; font-size: 22px; margin-bottom: 16px; text-align: center; }
        h2 { color: #666; font-size: 16px; margin-bottom: 12px; }
        h3 { color: #555; font-size: 14px; margin: 12px 0 8px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-file { background: #8b5cf6; color: white; }
        .btn-camera { background: #ec4899; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .log-area {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 16px;
            height: 150px;
            overflow-y: auto;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            color: #0f0;
        }
        .log-item { margin: 4px 0; line-height: 1.4; }
        .log-item.sent { color: #60a5fa; }
        .log-item.received { color: #34d399; }
        .log-item.info { color: #fbbf24; }
        .device-info { background: #f3f4f6; padding: 12px; border-radius: 8px; font-size: 13px; color: #666; }
        .device-info div { margin: 4px 0; }

        /* 媒体预览区域 */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        .media-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #f3f4f6;
        }
        .media-item img, .media-item video {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }
        .media-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .media-item .video-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }
        .media-info {
            font-size: 11px;
            color: #666;
            padding: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .empty-tip {
            text-align: center;
            color: #999;
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔗 JSBridge 通信测试</h1>
        <div class="device-info" id="deviceInfo">正在获取设备信息...</div>
    </div>

    <div class="card">
        <h2>📷 相机与相册</h2>
        <button class="btn btn-camera" onclick="NativeBridge.openCamera()">📸 拍照</button>
        <button class="btn btn-file" onclick="NativeBridge.openGallerySingle()">🖼️ 相册单选</button>
        <button class="btn btn-success" onclick="NativeBridge.openGalleryMulti()">📁 相册多选</button>
    </div>

    <div class="card">
        <h2>📤 发送消息到 RN</h2>
        <button class="btn btn-primary" onclick="sendSimpleMessage()">发送简单消息</button>
        <button class="btn btn-warning" onclick="sendActionMessage()">发送 Action 请求</button>
    </div>

    <div class="card">
        <h2>🎬 已选择的媒体</h2>
        <div id="mediaContainer">
            <div class="empty-tip">暂无选择的媒体</div>
        </div>
        <div id="mediaInfo" style="font-size: 12px; color: #666; margin-top: 8px;"></div>
    </div>

    <div class="card">
        <h2>📋 通信日志</h2>
        <div class="log-area" id="logArea"></div>
        <button class="btn btn-primary" onclick="clearLogs()" style="margin-top: 12px;">清空日志</button>
        <button class="btn btn-danger" onclick="clearMedia()" style="margin-top: 8px;">清除媒体</button>
    </div>

    <script>
        const logArea = document.getElementById('logArea');
        const deviceInfoEl = document.getElementById('deviceInfo');
        const mediaContainer = document.getElementById('mediaContainer');
        const mediaInfoEl = document.getElementById('mediaInfo');

        // 已选择的媒体文件
        let selectedMedia = [];

        // 日志函数
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `log-item ${type}`;
            div.textContent = `[${time}] ${message}`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLogs() {
            logArea.innerHTML = '';
            log('日志已清空', 'info');
        }

        // 初始化：获取设备信息
        function initDeviceInfo() {
            if (typeof window.NativeBridge !== 'undefined') {
                try {
                    const info = JSON.parse(window.NativeBridge.getDeviceInfo());
                    const timestamp = window.NativeBridge.getTimestamp();
                    deviceInfoEl.innerHTML = `
                        <div><strong>平台:</strong> ${info.platform}</div>
                        <div><strong>系统版本:</strong> Android ${info.version}</div>
                        <div><strong>设备型号:</strong> ${info.brand} ${info.model}</div>
                        <div><strong>时间戳:</strong> ${timestamp}</div>
                    `;
                    log('✅ JSBridge 已连接', 'info');
                    log('✅ 可调用 NativeBridge.openCamera()', 'info');
                    log('✅ 可调用 NativeBridge.openGallerySingle()', 'info');
                    log('✅ 可调用 NativeBridge.openGalleryMulti()', 'info');
                } catch (e) {
                    deviceInfoEl.textContent = '获取设备信息失败: ' + e.message;
                    log('❌ JSBridge 连接失败', 'info');
                }
            } else {
                deviceInfoEl.textContent = 'JSBridge 未注入（可能不在 WebView 环境）';
                log('⚠️ 非 WebView 环境', 'info');
            }
        }

        // 发送消息到 RN
        function sendToRN(data) {
            const message = typeof data === 'string' ? data : JSON.stringify(data);
            if (typeof window.NativeBridge !== 'undefined') {
                window.NativeBridge.postMessage(message);
                log(`📤 发送: ${message}`, 'sent');
            } else {
                log('❌ NativeBridge 不可用', 'info');
            }
        }

        function sendSimpleMessage() {
            sendToRN('Hello from WebView!');
        }

        function sendActionMessage() {
            sendToRN({
                type: 'request',
                action: 'getUserInfo',
                callbackId: 'cb_' + Date.now()
            });
        }

        // 接收来自 RN 的消息 (方式1: 函数回调)
        window.onNativeMessage = function(data) {
            log(`📥 收到: ${data}`, 'received');
            try {
                const parsed = JSON.parse(data);
                handleNativeMessage(parsed);
            } catch (e) {
                // 非 JSON 格式，忽略
            }
        };

        // 接收来自 RN 的消息 (方式2: 事件监听)
        window.addEventListener('nativeMessage', function(event) {
            log(`📥 事件收到: ${event.detail}`, 'received');
        });

        // 处理来自 Native 的消息
        function handleNativeMessage(data) {
            if (data.type === 'file_selected') {
                // 单个文件选择
                addMediaItem(data.data);
                log(`📷 选择文件: ${data.data.name}`, 'info');
            } else if (data.type === 'files_selected') {
                // 多个文件选择
                data.data.forEach(item => {
                    addMediaItem(item);
                });
                log(`📷 选择 ${data.data.length} 个文件`, 'info');
            } else if (data.type === 'response') {
                log(`📦 响应数据: ${JSON.stringify(data.data)}`, 'received');
            }
        }

        // 添加媒体项目到预览
        function addMediaItem(fileData) {
            const isVideo = fileData.type.startsWith('video/');
            const mediaId = 'media_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            const mediaItem = {
                id: mediaId,
                uri: fileData.uri,
                name: fileData.name,
                type: fileData.type,
                size: fileData.size
            };
            selectedMedia.push(mediaItem);

            const div = document.createElement('div');
            div.className = 'media-item';
            div.id = 'item_' + mediaId;
            div.dataset.uri = fileData.uri;

            if (isVideo) {
                div.innerHTML = `
                    <video src="${fileData.uri}" playsinline muted></video>
                    <div class="video-icon">▶️</div>
                    <button class="remove-btn" onclick="removeMedia('${mediaId}')">×</button>
                    <div class="media-info">${fileData.name}</div>
                `;
            } else {
                div.innerHTML = `
                    <img src="${fileData.uri}" alt="${fileData.name}" loading="lazy">
                    <button class="remove-btn" onclick="removeMedia('${mediaId}')">×</button>
                    <div class="media-info">${fileData.name}</div>
                `;
            }

            // 清空提示
            const emptyTip = mediaContainer.querySelector('.empty-tip');
            if (emptyTip) emptyTip.remove();

            // 添加到容器
            let grid = mediaContainer.querySelector('.media-grid');
            if (!grid) {
                grid = document.createElement('div');
                grid.className = 'media-grid';
                mediaContainer.appendChild(grid);
            }
            grid.appendChild(div);

            // 更新媒体信息
            updateMediaInfo();
        }

        // 移除媒体
        function removeMedia(mediaId) {
            const item = document.getElementById('item_' + mediaId);
            if (item) {
                item.remove();
                selectedMedia = selectedMedia.filter(m => m.id !== mediaId);

                // 如果没有媒体了，显示提示
                if (selectedMedia.length === 0) {
                    mediaContainer.innerHTML = '<div class="empty-tip">暂无选择的媒体</div>';
                }
                updateMediaInfo();
            }
        }

        // 清除所有媒体
        function clearMedia() {
            selectedMedia = [];
            mediaContainer.innerHTML = '<div class="empty-tip">暂无选择的媒体</div>';
            mediaInfoEl.textContent = '';
            log('🗑️ 已清除所有媒体', 'info');
        }

        // 更新媒体信息
        function updateMediaInfo() {
            if (selectedMedia.length > 0) {
                const totalSize = selectedMedia.reduce((sum, m) => sum + (m.size || 0), 0);
                const imageCount = selectedMedia.filter(m => m.type.startsWith('image/')).length;
                const videoCount = selectedMedia.filter(m => m.type.startsWith('video/')).length;
                mediaInfoEl.textContent = `共 ${selectedMedia.length} 个文件 (图片: ${imageCount}, 视频: ${videoCount}) - ${formatFileSize(totalSize)}`;
            } else {
                mediaInfoEl.textContent = '';
            }
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initDeviceInfo);

        // 如果 DOMContentLoaded 已经触发，直接初始化
        if (document.readyState !== 'loading') {
            initDeviceInfo();
        }
    </script>
</body>
</html>
